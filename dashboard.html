<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Thiếu Nhi</title>

    <link rel="stylesheet" href="./assets/reset.css" />
    <link rel="stylesheet" href="./assets/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body class="dashboard-page">
    <div class="app-container">
      <!-- HEADER -->
      <header class="header">
        <div class="header-left">
          <div class="logo-circle">
            <img
              src="/imgs/Logo Đoàn_KN.png"
              alt="Logo"
              onerror="this.src='https://via.placeholder.com/42'"
            />
          </div>
          <div class="church-info">
            <h2>Xứ Đoàn Don Bosco</h2>
            <p>Giáo xứ Tân Thái Sơn</p>
          </div>
        </div>

        <div class="header-center">
          <div class="mode-switch-group">
            <button class="mode-btn active" data-mode="input">Nhập điểm</button>
            <button class="mode-btn" data-mode="export">Xuất file</button>
            <button class="mode-btn" data-mode="manage">
              Quản lý Thiếu Nhi
            </button>
          </div>
        </div>

        <div class="header-right">
          <button class="switch-btn">switch</button>
        </div>
      </header>

      <!-- MAIN BODY -->
      <div class="main-body">
        <aside class="sidebar">
          <nav class="nav-menu">
            <ul>
              <li id="menuAttendance" class="nav-item active">Điểm danh</li>
              <li id="menuTestScore" class="nav-item">Điểm kiểm tra</li>
            </ul>
          </nav>
          <div class="bottom-menu">
            <a href="#" class="bottom-link">Đổi mật khẩu</a>
            <a href="index.html" class="bottom-link">Đăng xuất</a>
          </div>
        </aside>

        <main class="content-area">
          <div class="content-card">
            <!-- Search Bar -->
            <div class="search-container">
              <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Tra cứu..." />
                <button class="search-btn-icon">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </button>
              </div>
            </div>

            <div id="dataContainer">
              <!-- TAB 1: ĐIỂM DANH -->
              <section id="sectionAttendance" class="tab-section">
                <div class="table-header-action">
                  <h2>ĐIỂM DANH LỚP 1</h2>
                  <div class="header-controls">
                    <button class="btn-pdf hidden" id="pdfBtnAttendance">
                      XUẤT PDF
                    </button>
                    <select class="custom-select" id="dateAttendance">
                      <option>09 - 2026</option>
                      <option>10 - 2026</option>
                    </select>
                  </div>
                </div>
                <table class="data-table" id="tableAttendance">
                  <thead>
                    <tr>
                      <th>Mã Thiếu Nhi</th>
                      <th>Lớp</th>
                      <th>Tên Thiếu Nhi</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>000000</td>
                      <td>1A</td>
                      <td>Nguyễn Văn A</td>
                      <td><span class="action-circle"></span></td>
                    </tr>
                    <tr>
                      <td>000001</td>
                      <td>1B</td>
                      <td>Nguyễn Thị B</td>
                      <td><span class="action-circle"></span></td>
                    </tr>
                  </tbody>
                </table>
              </section>

              <!-- TAB 2: ĐIỂM KIỂM TRA -->
              <section id="sectionTestScore" class="tab-section hidden">
                <div class="table-header-action">
                  <h2>ĐIỂM KIỂM TRA LỚP 1</h2>
                  <div class="header-controls">
                    <button class="btn-pdf hidden" id="pdfBtnTest">
                      XUẤT PDF
                    </button>
                    <select class="custom-select" id="dateTest">
                      <option>09 - 2026</option>
                      <option>10 - 2026</option>
                    </select>
                  </div>
                </div>
                <table class="data-table" id="tableTestScore">
                  <thead>
                    <tr>
                      <th>Mã Thiếu Nhi</th>
                      <th>Lớp</th>
                      <th>Điểm 15P</th>
                      <th>Điểm 1 Tiết</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>000000</td>
                      <td>1A</td>
                      <td>8.5</td>
                      <td>9.0</td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </div>

            <!-- TAB 3: QUẢN LÝ -->
            <div
              id="manageContainer"
              class="hidden"
              style="text-align: center; padding: 40px 0"
            >
              <h2 style="font-size: 18px; color: #1e293b">
                QUẢN LÝ DANH SÁCH THIẾU NHI
              </h2>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="./js/dashboard.js"></script>
  </body>
</html>
